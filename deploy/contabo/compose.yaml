name: openreply
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/fullchain.pem
      - -c
      - ssl_key_file=/certs/privkey.pem
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_connections=60
    ports:
      - "15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./certs/postgres:/certs:ro
      - ./deploy/contabo/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openreply -d openreply"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m
    networks: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    ports:
      - "16379:6380"
    volumes:
      - ./data/redis:/data
      - ./certs/redis:/certs:ro
      - ./.deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 384m
    networks: [backend]
  worker:
    build:
      context: .
      dockerfile: deploy/contabo/Dockerfile.worker
    restart: unless-stopped
    init: true
    env_file: .env.worker
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - ./node_modules/.bin/tsx
        - -e
        - "import {getWorkerHealth} from './lib/ops/worker-health'; getWorkerHealth().then(h => process.exit(h.healthy ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 768m
    networks: [backend]
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.53.0/24
